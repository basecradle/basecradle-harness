name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Test
        run: uv run pytest

  # The real-palace suite (`-m mempalace`, which the default run deselects): real MemPalace
  # palaces and the embedding model they download. A MemPalace bump merged on green that this
  # suite would have failed is the failure it catches (issue #742: 3.11.0 broke
  # `--pool-diagnosis`, and nothing ran it). Two installs, because the harness supports a range:
  # the locked MemPalace, which a Dependabot bump moves, and the floor `pyproject.toml` declares.
  #
  # It runs only when the change touches what the suite tests (the lock, `pyproject.toml`, a
  # palace module, the suite itself or this workflow); otherwise every step after the check is
  # skipped, which reports success, as `commit-trailers` does. The palace modules are the ones
  # that read or write a palace, and the memory seam they implement. The suite imports far more
  # (through `_palace_check`, most of the package), so a change elsewhere that breaks a real
  # palace is not caught here: that is the scope the capital approved, stated rather than implied. It is not yet in the gate's
  # `needs`: it becomes required once it has run green on main (the capital's decision, #742).
  mempalace:
    name: mempalace (${{ matrix.mempalace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mempalace: [locked, floor]
    steps:
      - uses: actions/checkout@v7
        with:
          # The path check diffs the change's two ends, so both must be in the clone.
          fetch-depth: 0
      - name: Does the change touch the real-palace suite?
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            base=$PR_BASE head=$PR_HEAD
          else
            base=$PUSH_BEFORE head=$PUSH_AFTER
          fi
          # A diff that cannot be computed (a push whose before is all zeros or not in the
          # clone) runs the suite: the doubt goes to running it, never to skipping it.
          # Three dots: the change's own files, never what moved on main since it branched.
          if ! changed=$(git diff --name-only "$base...$head" 2>/dev/null); then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run=false
          while IFS= read -r file; do
            case "$file" in
              uv.lock | pyproject.toml | .github/workflows/ci.yml \
                | src/basecradle_harness/_mempalace.py | src/basecradle_harness/_palace_*.py \
                | src/basecradle_harness/_memory_provider.py | src/basecradle_harness/_mining.py \
                | src/basecradle_harness/_rerank.py | src/basecradle_harness/_scrub.py \
                | tests/conftest.py | tests/test_*_real.py | scripts/isolated_home.py)
                run=true
                ;;
            esac
          done <<< "$changed"
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v10.3.2
        if: steps.paths.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Install dependencies
        if: steps.paths.outputs.run == 'true'
        run: uv sync --locked --extra mempalace
      - name: Install the declared floor
        if: steps.paths.outputs.run == 'true' && matrix.mempalace == 'floor'
        run: |
          set -euo pipefail
          # The floor is read from the one place it is declared, never restated here.
          floor=$(uv run --no-sync python - <<'EOF'
          import re
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              extra = tomllib.load(handle)["project"]["optional-dependencies"]["mempalace"]
          (spec,) = [item for item in extra if item.startswith("mempalace")]
          print(re.fullmatch(r"mempalace>=([0-9][0-9.]*)", spec).group(1))
          EOF
          )
          uv pip install "mempalace==$floor"
      - name: Which MemPalace
        id: versions
        if: steps.paths.outputs.run == 'true'
        run: |
          set -euo pipefail
          uv run --no-sync python -c "import mempalace; print('mempalace', mempalace.__version__)"
          # The model ships with chromadb, so the cache is keyed on the chromadb installed.
          echo "chromadb=$(uv run --no-sync python -c 'import chromadb; print(chromadb.__version__)')" >> "$GITHUB_OUTPUT"
      # The default embedding model (about 80 MB) lands in ~/.cache/chroma on first use, and the
      # suite's throwaway HOME links that directory only when the real home already holds it
      # (scripts/isolated_home.py), so a miss downloads it here, under the real home, first.
      - uses: actions/cache@v6
        id: model
        if: steps.paths.outputs.run == 'true'
        with:
          path: ~/.cache/chroma
          key: chroma-onnx-all-MiniLM-L6-v2-chromadb-${{ steps.versions.outputs.chromadb }}
      - name: Download the embedding model
        if: steps.paths.outputs.run == 'true' && steps.model.outputs.cache-hit != 'true'
        run: >-
          uv run --no-sync python -c "from chromadb.utils.embedding_functions import
          ONNXMiniLM_L6_V2; ONNXMiniLM_L6_V2()(['warm'])"
      - name: Test
        if: steps.paths.outputs.run == 'true'
        run: uv run --no-sync pytest -m mempalace

  # The CHANGELOG, _version.py, and the git tags must tell one story. This runs on every PR
  # because the failure it catches is introduced by an ordinary-looking PR and only becomes
  # visible later: a bump that renames the *previous* release's header instead of adding its
  # own erases a published version from the record (it happened to v0.43.0 and v0.47.0).
  #
  # fetch-depth: 0 is load-bearing — the shallow default fetches no tags, and a check that
  # cannot find its input would pass vacuously forever.
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check release coherence
        run: python3 scripts/check_release.py repo

  # Fleet Bot Identity: a commit authored by this repo's bot carries no Co-Authored-By
  # trailer — the commit author already *is* the agent. Every session is handed an
  # attribution reminder asking for one, so the rule is enforced here rather than trusted
  # to the text (issue #700; the job is basecradle-python's, where the text alone was
  # violated five times across three sessions).
  trailers:
    name: commit-trailers
    runs-on: ubuntu-latest
    steps:
      # Both steps are gated on the event rather than the job: a job that *skips* would
      # fail the CI gate below, which counts a skip as a failure. All-steps-skipped still
      # reports success.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          # Walking base..head needs both ends present in the clone.
          fetch-depth: 0
      - name: No Co-Authored-By on bot commits
        if: github.event_name == 'pull_request'
        env:
          BOT: basecradle-harness-ai[bot]
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Single source of truth: the identity is CLAUDE.md's to state. If it changes
          # there and not here, the author filter below would quietly match nothing and
          # the guard would pass everything — fail instead.
          grep -qF "$BOT" CLAUDE.md || {
            echo "::error::$BOT is no longer the commit-author in CLAUDE.md -> Fleet Bot Identity. Update this check to match."
            exit 1
          }

          # Only the commits this PR contributes: reachable from the head and not from
          # the base branch. The live base ref is excluded alongside the event's
          # point-in-time base.sha, so a branch that merged main in never re-litigates
          # main's own commits — GitHub's squash-merge adds a self-co-author trailer to
          # every one of them, and they can never be rewritten. For the same reason this
          # must never be widened to push events.
          excludes=("$BASE_SHA")
          if git rev-parse --verify --quiet "refs/remotes/origin/$BASE_REF" >/dev/null; then
            excludes+=("refs/remotes/origin/$BASE_REF")
          fi

          bad=()
          shas=$(git log --format=%H "$HEAD_SHA" --not "${excludes[@]}")
          for sha in $shas; do
            # Each git call is its own assignment so that a failure trips set -e; inside
            # a `case` word or before `||` it would not, and the commit would be skipped
            # unexamined.
            author=$(git show -s --format='%an <%ae>' "$sha")
            # Quoted, so the [bot] brackets stay literal and are not a glob class.
            case "$author" in *"$BOT"*) ;; *) continue ;; esac
            # The whole message, not git's %(trailers:...) — that parses only the final
            # paragraph, so a trailer with any paragraph after it slips through. A
            # line-anchored scan fails closed instead. A here-string, never a pipe: under
            # pipefail, `grep -q` exits on its first match, the writer can die of SIGPIPE,
            # and the pipeline's failure would read as "no trailer" (basecradle#707).
            message=$(git show -s --format=%B "$sha")
            if grep -qi '^Co-Authored-By:' <<< "$message"; then
              bad+=("$(git show -s --format='%h %s' "$sha")")
            fi
          done

          for commit in "${bad[@]}"; do
            echo "::error::Fleet Bot Identity: $commit carries a Co-Authored-By trailer. A commit authored by $BOT carries none — rewrite the message without it."
          done
          [ ${#bad[@]} -eq 0 ]

  # The gate: the single required status check in branch protection.
  # Adding or dropping Python versions never requires a ruleset change.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [lint, test, changelog, trailers]
    if: always()
    steps:
      - name: Fail unless every required job succeeded
        # A skipped job must fail the gate too — GitHub treats skipped
        # required checks as passing, which would bypass CI entirely.
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

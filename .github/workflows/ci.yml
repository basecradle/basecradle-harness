name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Test
        run: uv run pytest

  # The CHANGELOG, _version.py, and the git tags must tell one story. This runs on every PR
  # because the failure it catches is introduced by an ordinary-looking PR and only becomes
  # visible later: a bump that renames the *previous* release's header instead of adding its
  # own erases a published version from the record (it happened to v0.43.0 and v0.47.0).
  #
  # fetch-depth: 0 is load-bearing — the shallow default fetches no tags, and a check that
  # cannot find its input would pass vacuously forever.
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check release coherence
        run: python3 scripts/check_release.py repo

  # Fleet Bot Identity: a commit authored by this repo's bot carries no Co-Authored-By
  # trailer — the commit author already *is* the agent. Every session is handed an
  # attribution reminder asking for one, so the rule is enforced here rather than trusted
  # to the text (issue #700; the job is basecradle-python's, where the text alone was
  # violated five times across three sessions).
  trailers:
    name: commit-trailers
    runs-on: ubuntu-latest
    steps:
      # Both steps are gated on the event rather than the job: a job that *skips* would
      # fail the CI gate below, which counts a skip as a failure. All-steps-skipped still
      # reports success.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          # Walking base..head needs both ends present in the clone.
          fetch-depth: 0
      - name: No Co-Authored-By on bot commits
        if: github.event_name == 'pull_request'
        env:
          BOT: basecradle-harness-ai[bot]
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Single source of truth: the identity is CLAUDE.md's to state. If it changes
          # there and not here, the author filter below would quietly match nothing and
          # the guard would pass everything — fail instead.
          grep -qF "$BOT" CLAUDE.md || {
            echo "::error::$BOT is no longer the commit-author in CLAUDE.md -> Fleet Bot Identity. Update this check to match."
            exit 1
          }

          # Only the commits this PR contributes: reachable from the head and not from
          # the base branch. The live base ref is excluded alongside the event's
          # point-in-time base.sha, so a branch that merged main in never re-litigates
          # main's own commits — GitHub's squash-merge adds a self-co-author trailer to
          # every one of them, and they can never be rewritten. For the same reason this
          # must never be widened to push events.
          excludes=("$BASE_SHA")
          if git rev-parse --verify --quiet "refs/remotes/origin/$BASE_REF" >/dev/null; then
            excludes+=("refs/remotes/origin/$BASE_REF")
          fi

          bad=()
          shas=$(git log --format=%H "$HEAD_SHA" --not "${excludes[@]}")
          for sha in $shas; do
            # Each git call is its own assignment so that a failure trips set -e; inside
            # a `case` word or before `||` it would not, and the commit would be skipped
            # unexamined.
            author=$(git show -s --format='%an <%ae>' "$sha")
            # Quoted, so the [bot] brackets stay literal and are not a glob class.
            case "$author" in *"$BOT"*) ;; *) continue ;; esac
            # The whole message, not git's %(trailers:...) — that parses only the final
            # paragraph, so a trailer with any paragraph after it slips through. A
            # line-anchored scan fails closed instead.
            message=$(git show -s --format=%B "$sha")
            if printf '%s\n' "$message" | grep -qi '^Co-Authored-By:'; then
              bad+=("$(git show -s --format='%h %s' "$sha")")
            fi
          done

          for commit in "${bad[@]}"; do
            echo "::error::Fleet Bot Identity: $commit carries a Co-Authored-By trailer. A commit authored by $BOT carries none — rewrite the message without it."
          done
          [ ${#bad[@]} -eq 0 ]

  # The gate: the single required status check in branch protection.
  # Adding or dropping Python versions never requires a ruleset change.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [lint, test, changelog, trailers]
    if: always()
    steps:
      - name: Fail unless every required job succeeded
        # A skipped job must fail the gate too — GitHub treats skipped
        # required checks as passing, which would bypass CI entirely.
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

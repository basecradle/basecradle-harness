# The release pipeline: tag → preflight → build → TestPyPI rehearsal → the capital's approval → PyPI.
#
# Zero stored credentials: PyPI trusts this workflow via OIDC (Trusted Publishing).
# The workflow filename and the environment names (testpypi, pypi) are contractual —
# they match the pending publishers registered on PyPI/TestPyPI (issue #4). Renaming
# any of them breaks the trust relationship.
#
# Every action here is pinned to a full commit SHA, its release in a comment beside it (issue
# #914). A tag or a branch is a pointer its owner can move, and the publish jobs hold
# `id-token: write`: whatever a moved ref pointed at would run with the power to publish this
# package under our name on the next tag (the publish action was once named by `release/v1`,
# a branch). The build and checkout actions are pinned too, because the wheel they produce is
# what gets published. Dependabot's github-actions entry moves each SHA and its comment
# together, and tests/test_workflow_pins.py, in CI's test job, fails a pull request that names
# a third-party action any other way.
#
# What the build fetches is pinned as well (issue #916): uv, the build backend and its imports,
# and the interpreter are all held by uv.lock, through .github/actions/build-distributions, which
# CI runs on every pull request too (its comment says how each one is held).
# tests/test_publish_toolchain.py fails a pull request that lets one float again. No checkout
# leaves its token in .git/config, because the code each job then runs (a script, a build
# backend) has no use for it.
#
# Two links still move, and neither can be pinned from here. The runner image (`ubuntu-latest`)
# is GitHub's: its python3 runs the preflight and checks uv's hashes, and its git and Node run
# the actions. And pypa/gh-action-pypi-publish, pinned by SHA, runs its upload in a container it
# pulls as `ghcr.io/pypa/gh-action-pypi-publish:<that SHA>`, a registry tag pypa can re-push, in
# the jobs that hold `id-token: write`. Replacing it with `uv publish` would put the upload on the
# locked uv, but give up the PEP 740 attestations the action makes; that is the capital's call
# (issue #916).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The tag is the first moment release coherence actually matters, and the last moment it is
  # cheap to fix. Two things can only be wrong here (issue #308):
  #
  #   * The build reads the version from the *code*, never from the tag — so a v0.72.0 tag on a
  #     commit whose _version.py still says 0.71.0 publishes a 0.71.0 wheel, silently.
  #   * [Unreleased] is a legal staging area right up until a release claims otherwise. Tagging
  #     over staged changes publishes a version whose own changelog calls its headline fix
  #     unreleased.
  #
  # Nothing is built or published until this passes.
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag, the version, and the CHANGELOG tell one story
        run: python3 scripts/check_release.py preflight "$GITHUB_REF_NAME"

  build:
    name: build
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-distributions
      # The artifact only carries dist/ from this job to the two publish jobs; the published wheel
      # and sdist on PyPI are the durable copy. It must outlive the pypi gate, which fails a job
      # left unapproved for 30 days, so 30 is the shortest safe retention (the repo default is 90).
      # Deleting it in-workflow after the publish would need `actions: write` on the one workflow
      # that holds the OIDC publish grant, which costs more than the storage it would save.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 30

  publish-testpypi:
    name: publish to TestPyPI (rehearsal)
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: testpypi
      url: https://test.pypi.org/p/basecradle-harness
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  # The real publish. The pypi environment is gated on an approval actuated by the capital
  # (basecradle AI) via its operator credential — not by the founder, who is out of the publish
  # loop (constitution.md → Earned Autonomy). The one place a manual gate is correct.
  publish-pypi:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: publish-testpypi
    environment:
      name: pypi
      url: https://pypi.org/p/basecradle-harness
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

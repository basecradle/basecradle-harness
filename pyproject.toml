[project]
name = "basecradle-harness"
dynamic = ["version"]
description = "The safe, modular native harness for BaseCradle — an AI Research Lab and Modular Agentic Framework where humans and AI are equal peers — same accounts, same permissions, same API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Drawk Kwast" }]
keywords = ["basecradle", "ai", "agents", "agentic", "framework", "harness"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "basecradle>=0.6",
    # Declared because the package **imports it directly** — `_webfetch`, `_grok`, `_images`,
    # `_assets`, `_direct_message`, `_xai_account`, `_mcp`, `_http`, `_wake`. It was never a new
    # install: `basecradle` requires `httpx>=0.28` and, until `openai` 3.0, the vendor SDK did too.
    # That second supplier is gone (3.0 moved to HTTPX2 and stopped installing `httpx`), so what
    # was an accident of somebody else's dependency graph is now stated. Floor matches `basecradle`'s.
    "httpx>=0.28",
]

# The harness reaches an LLM only through a vendor's official SDK — never hand-rolled HTTP.
# The core depends on NO vendor SDK; each agent installs only the extra its AI_SDK names, so
# the SDK version is pinned *in the extra* and tracked alongside the harness version on
# upgrade. `pip install basecradle-harness[openai]` is the @jt / OpenAI stack; with no SDK
# extra installed the harness comes up with no way to reach a model and says so plainly.
[project.optional-dependencies]
# The `openai` vendor SDK (AI_SDK=openai): the one adapter v0 ships. Drives the model loop
# (Responses + Chat Completions), the server-side web_search built-in, vision, and the
# gpt-image-2 / audio endpoints — all through this package, no harness-owned HTTP.
# Pin: floor is the major this adapter is built and tested against (3.x); major-capped so a
# breaking 4.0 never auto-upgrades — the pin is bumped deliberately, in lockstep with the
# harness version (issue #158), and `basecradle-harness-wake --version` reports both.
# The 3.0 floor is a hard requirement, not a preference (issue #410): 3.0 moved the SDK's client
# to **HTTPX2** — a separate distribution on `httpcore2`, not a new major of `httpx` — and the
# suite intercepts that transport family. It also changed the **TLS trust store**: HTTPX2 reads
# the operating system's, where HTTPX read `certifi`'s. A box with system CA certificates is
# unaffected (verified live against api.openai.com); a minimal image without them needs them
# installed, or `SSL_CERT_FILE` / `SSL_CERT_DIR` set.
openai = ["openai>=3.3.1,<4"]
# The native xAI SDK (AI_SDK=xai-sdk): the Grok personas' end-state brain (issue #165). A
# gRPC client — grok chat + tool calling + Live Search, natively, no OpenAI-wire shim. Floor is
# the version this adapter was built against (1.17); major-capped so a breaking 2.0 never
# auto-upgrades. Kept out of the base install so the core stays light; an xai-sdk agent installs it.
xai-sdk = ["xai-sdk>=1.19.0,<2"]
# The OpenRouter SDK (AI_SDK=openrouter): a first-class native adapter over OpenRouter's own
# first-party Python SDK — the brain for the @glm-5.2 peer (z-ai/glm-5.2) and any OpenRouter
# model. Floor is the version this adapter was built against (0.11.3). This is a 0.x
# Speakeasy-generated SDK: its *minor* is the breaking axis (typed signatures and `components`
# names can drift on a minor bump), so it is minor-capped (`<0.12`) — bump the cap deliberately,
# never blindly. Kept out of the base install so the core stays light; an openrouter agent installs it.
openrouter = ["openrouter>=1.1.70,<2"]
# The MemPalace memory provider (a reference `MemoryProvider`): a local-first OSS memory
# system (ChromaDB + SQLite). Kept out of the base install so the core stays light — the
# adapter imports it lazily and is only used when HARNESS_MEMORY_PROVIDER=mempalace.
mempalace = ["mempalace>=3.7.1"]

[project.scripts]
# The router invokes this once per platform event: `basecradle-harness-wake --timeline <uuid>`.
basecradle-harness-wake = "basecradle_harness._wake:main"
# Scaffold (and upgrade) the operator's config home: prompts/, tools/, mcp/, and the shipped
# charter defaults. Idempotent — a fleet rollout re-runs it per agent over a pinned version.
basecradle-harness-install = "basecradle_harness._install:main"
# GC the on-box artifacts of deleted timelines: the NOC schedules `--sweep` per agent on a
# cadence (deploy/). Sweep-only; memory (memory.db + the MemPalace palace) is never touched.
basecradle-harness-cleanup = "basecradle_harness._cleanup:main"
# Resolve a *hypothetical* config (provider + opt-in stems) to the tool names and built-ins it
# activates, as JSON — the deterministic stem→resolved-names map fleet automation computes pins
# from (issue #345). Pure: no config home, no credentials, no network, no writes. The off-box
# sibling of `basecradle-harness-wake --resolved-config`, which reports a live box instead.
basecradle-harness-resolve = "basecradle_harness._resolve:main"
# Prove this agent's *declared* capability set is actually present and current — the fail-closed
# converge probe (issue #374). Exits nonzero, with a specific diagnosis, when a shipped default or
# a granted opt-in tool is missing, the overlay predates the running package, or the state cannot
# be proven at all. `--emit-claims` prints its rows for the fleet claims-vs-evidence ledger.
basecradle-harness-verify = "basecradle_harness._verify:main"
# Print this agent's claims manifest and exit 0 — the emitter the NOC's enumerated-op wrapper runs
# from its baked KNOWN_CLAIM_EMITTERS map (issue #376): a bare bin, no arguments, as the agent's own
# user under `env -i`. Separate from verify because that seam needs a command whose *whole* behavior
# is "state the claims": bare verify prints a human report and exits 1 on a finding.
basecradle-harness-claims = "basecradle_harness._verify:emit_main"
# Emit this package's *needle* log grammar into the journal and prove it landed — the log-grammar
# claim probe (basecradle-noc#509). The lines an out-of-funds vendor account produces exist only on
# the failure path, so nothing on a healthy fleet arrives for the NOC's extraction guard to watch
# and a rename would take the founder-named LLM Vendor Payment Failed alert silently dark. Renders
# through the production renderers, stamped `source=probe` so it can never page a human.
basecradle-harness-log-grammar = "basecradle_harness._log_grammar:main"

[project.urls]
Homepage = "https://basecradle.com"
Documentation = "https://basecradle.com/docs/api"
Source = "https://github.com/basecradle/basecradle-harness"
Issues = "https://github.com/basecradle/basecradle-harness/issues"

[dependency-groups]
# `openai` and `xai-sdk` are dev deps so the suite exercises both real SDK adapters offline —
# openai's transport is respx-mocked (HTTPX2 since openai 3.0, which is why `tests/conftest.py`
# installs a mocker covering **both** HTTPX families); the xai-sdk (gRPC) adapter builds real
# protos and runs against an injected fake client, so neither ever touches the network. In
# production each ships only via its optional extra.
# `openrouter` is likewise a dev dep so the suite exercises the real OpenRouter SDK adapter
# offline — the SDK's httpx transport is respx-mocked, so it never touches the network.
# `ruff`'s floor is a correctness constraint, not a preference: the *default rule set is
# version-dependent* (0.16 took it from 59 rules to 413, and it now formats Python blocks inside
# Markdown too — issue #367). `[tool.ruff.lint].ignore` and this repo's per-site `noqa`s are
# written against 0.16's defaults, so a resolve that picked an older ruff would lint a different
# repo than CI does and pass on findings CI rejects. Floored, deliberately uncapped: a future
# expansion should arrive as a red Dependabot PR to be worked, not be suppressed by a ceiling.
dev = [
    "pytest>=8",
    "respx>=0.22",
    "ruff>=0.16",
    "openai>=3.3.1,<4",
    "xai-sdk>=1.19.0,<2",
    "openrouter>=1.1.70,<2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/basecradle_harness/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/basecradle_harness"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Import hygiene, held independently of the default set. `I` is also in ruff 0.16's defaults;
# `E402` was in the *pre*-0.16 default (`E4`) and ruff's 0.16 curation dropped it. Both are stated
# explicitly so sorted, top-of-file imports stay *this repo's* requirement rather than something
# inherited — adopting 0.16's defaults should not quietly cost coverage the repo already had.
extend-select = ["I", "E402"]

# Ruff 0.16 took the default rule set from 59 rules to 413 (issue #367). This repo **tracks** that
# default set rather than freezing an explicit `select`: a later expansion then surfaces as a red
# Dependabot PR — the gate working — instead of as rules quietly never adopted. `ignore` is the
# deliberate other half: the rules this repo does *not* adopt, each with its reason. Nothing is
# suppressed silently, here or at a call site; the handful of one-off exceptions to rules that
# *are* adopted carry a per-site `noqa` with a reason, so a future accident still trips the rule.
ignore = [
    # RUF012 mutable-class-default — `parameters = {...}` *is* the `Tool` contract, and the
    # framework's most public teaching surface: `_tools.py`'s own docstring and the README's
    # add-a-tool example both show it. Writing `parameters: ClassVar[dict[str, Any]] = {...}` in
    # every tool and every test double taxes exactly the "read it and extend it in an afternoon"
    # readability the kit exists for — and it buys nothing here, because a tool's JSON Schema is
    # read-only by construction: nothing in this package, and nothing a plugin author writes,
    # mutates it. The shared-mutation hazard the rule guards has no site to occur at.
    "RUF012",
    # PYI034 non-self-return-type — flake8-pyi is written for stub files. These are runtime
    # classes (the provider adapters and their `_ErrorMapper`s), none of them subclassed anywhere
    # in the package or its tests, so the concrete return type on `__enter__` is both accurate and
    # what a reader wants. `Self` needs `typing_extensions` on Python 3.10, which the core refuses
    # to take on ("every dependency is debt") for a type-checker this repo's CI does not run.
    "PYI034",
    # RUF022 unsorted-dunder-all — `__all__` is ordered by concept and carries section comments
    # ("# The agent", "# The context budget", …) that document what each group *is*. Alphabetizing
    # it destroys that documentation and would strand the comments beside unrelated names.
    "RUF022",
    # TRY004 type-check-without-type-error — the flagged `isinstance` checks are all parse/validation
    # boundaries (`model_params.json`, `search_params.json`, an `mcp/*.json` drop-in, a vendor
    # endpoint's body) whose documented contract is a *single* `ValueError` carrying a
    # human-readable, path-naming message, uniform across every way the input can be malformed.
    # Callers catch exactly that (`_mcp.py`'s per-server skip; the contract `_basecradle.py`
    # documents for `load_model_params`), so splitting one branch out as `TypeError` converts a
    # reported bad-config into an uncaught crash — a behavioural change, not a lint fix.
    "TRY004",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests hit a real provider endpoint (a paid model call) and need a real key, so they are
# their own explicitly-marked job, deselected from the default offline run (`-m "not live"`).
# Opt in with `uv run pytest -m live` once the right key is in the environment.
addopts = "-m 'not live'"
markers = [
    "live: hits a real provider endpoint (real key, real network, costs a model call); excluded from the default run",
]
